name: Release own signed packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python tools/check_docs.py
      - run: python tools/build_frontends.py --install
      - run: python tools/check_source_layout.py
      - run: python -m pytest
      - name: Build signed release using your own secrets
        env:
          PLUGIN_SIGNING_KEY_ID: ${{ secrets.PLUGIN_SIGNING_KEY_ID }}
          PLUGIN_SIGNING_KEY_B64: ${{ secrets.PLUGIN_SIGNING_KEY_B64 }}
        run: python tools/build_packages.py --publish
      - run: python tools/verify_packages.py dist/*.utp
      - run: python tools/validate_packages.py --full dist/*.utp
      - run: python tools/distribution.py --check-source
      - name: Preserve previously published bytes
        run: |
          if git cat-file -e HEAD:list.json 2>/dev/null; then
            python tools/distribution.py --baseline-ref HEAD
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: signed-release-${{ github.sha }}
          path: |
            dist/*.utp
            releases/*.json
            list.json
            plugins/*/manifest.json
          if-no-files-found: error
